<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weingut – Browser Prototype 0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17140f;color:#f5ead7;font-family:system-ui,-apple-system,sans-serif}
.app{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:25px;margin:0}.money{font-weight:800;font-size:20px}
.card{background:#252018;border:1px solid #514531;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 8px 24px #0004}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#30291e;border-radius:12px;padding:11px}.label{font-size:12px;opacity:.7}.value{font-size:20px;font-weight:750}
button{border:0;border-radius:12px;padding:12px 15px;background:#b8894d;color:#17140f;font-weight:800;font-size:15px;touch-action:manipulation}
button:active{transform:scale(.98)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
#field{position:relative;overflow:hidden;height:390px;background:linear-gradient(#91ad73,#66844e);border-radius:14px;border:2px solid #8d744a}
.row{position:absolute;left:4%;width:92%;height:10px;border-radius:10px;background:#60482b}
.vine{position:absolute;width:8px;height:22px;background:#49351f;border-radius:5px;transform:translate(-50%,-50%)}
.leaf{position:absolute;width:15px;height:10px;background:#2f5b2d;border-radius:50%;transform:translate(-50%,-50%) rotate(-20deg)}
.grape{position:absolute;width:9px;height:9px;background:#6d3e74;border-radius:50%;transform:translate(-50%,-50%);box-shadow:4px 2px #5a335f}
.player{position:absolute;width:18px;height:18px;background:#f2d08b;border:3px solid #332617;border-radius:50%;transform:translate(-50%,-50%);z-index:5}
.hint{font-size:13px;opacity:.75;margin-top:9px}.log{font-size:14px;line-height:1.45;max-height:160px;overflow:auto}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>🍇 Weingut – Prototype 0.1</h1><div class="money" id="money">1.000 €</div></div>

<div class="card">
<div class="stats">
<div class="stat"><div class="label">Fläche</div><div class="value" id="area">–</div></div>
<div class="stat"><div class="label">Boden</div><div class="value" id="soil">–</div></div>
<div class="stat"><div class="label">Lage</div><div class="value" id="slope">–</div></div>
<div class="stat"><div class="label">Mikroklima</div><div class="value" id="climate">–</div></div>
</div>
<div class="actions">
<button onclick="newVineyard()">🎲 Neuer Weinberg</button>
<button onclick="inspect()">🔎 Bodenprobe</button>
<button onclick="job()">🤝 Lohnarbeit bei Walter</button>
</div>
</div>

<div class="card">
<div id="field"><div class="player" id="player"></div></div>
<div class="hint">Auf dem iPhone: über den Weinberg wischen, um dich zu bewegen. 🧑‍🌾</div>
</div>

<div class="card">
<strong>Walter</strong>
<div class="log" id="log">„Na, dann wollen wir mal sehen, was aus Dieters altem Weinberg noch wird.“</div>
</div>
</div>

<script>
const field=document.getElementById('field');let money=1000,p={x:50,y:82},data={};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function fmt(n){return Math.round(n).toLocaleString('de-DE')+' €'}
function newVineyard(){
 data.area=(Math.random()*.5+.5).toFixed(2);
 data.soil=pick(['sandig','lehmig','kalkhaltig','tonig','steinig']);
 data.slope=pick(['flach','sanft geneigt','Südhang','Südwesthang','steiler Hang']);
 data.climate=pick(['kühl','ausgeglichen','warm','sehr warm']);
 data.score=Math.round(45+Math.random()*55);
 renderField();update();
 log(`Walter betrachtet den neuen Weinberg: „${data.slope}, ${data.soil} Boden… könnte schlechter sein. Aber ob er wirklich taugt, sehen wir erst später.“`);
}
function update(){
 area.textContent=data.area+' ha';soil.textContent=data.soil;slope.textContent=data.slope;climate.textContent=data.climate;
 document.getElementById('money').textContent=fmt(money);
}
function renderField(){
 field.querySelectorAll('.row,.vine,.leaf,.grape').forEach(e=>e.remove());
 for(let r=0;r<18;r++){
  let row=document.createElement('div');row.className='row';row.style.top=(8+r*4.7)+'%';field.appendChild(row);
  for(let v=0;v<16;v++){
   let x=7+v*5.7+(Math.random()-.5)*1.2,y=8+r*4.7+(Math.random()-.5)*1.5;
   let vine=document.createElement('div');vine.className='vine';vine.style.left=x+'%';vine.style.top=y+'%';field.appendChild(vine);
   for(let k=0;k<3;k++){let leaf=document.createElement('div');leaf.className='leaf';leaf.style.left=(x+(k-1)*1.4)+'%';leaf.style.top=(y-1.5-Math.random()*2)+'%';field.appendChild(leaf)}
   if(Math.random()<.6){let g=document.createElement('div');g.className='grape';g.style.left=(x+Math.random()*2-1)+'%';g.style.top=(y+Math.random()*3)+'%';field.appendChild(g)}
  }
 }
 placePlayer();
}
function placePlayer(){document.getElementById('player').style.left=p.x+'%';document.getElementById('player').style.top=p.y+'%'}
function inspect(){
 let quality=Math.min(100,Math.round(data.score+(Math.random()*12-6)));
 let cost=35;if(money>=cost){money-=cost;update();log(`Bodenprobe kostet 35 €. Ergebnis: ${quality}/100 Standortpotenzial. Walter: „Das ist schon eher interessant.“`)}else log('Walter: „Erstmal Geld verdienen, dann reden wir über Bodenproben.“');
}
function job(){let gain=120+Math.floor(Math.random()*101);money+=gain;update();log(`Du hast Walter bei der Weinbergsarbeit geholfen und ${gain} € verdient. „Danke! Dein Großvater war genauso fleißig.“`)}
function log(t){document.getElementById('log').innerHTML=t+'<br><br>'+document.getElementById('log').innerHTML}
let dragging=false;
field.addEventListener('pointerdown',e=>{dragging=true;field.setPointerCapture(e.pointerId);move(e)});
field.addEventListener('pointermove',e=>{if(dragging)move(e)});
field.addEventListener('pointerup',()=>dragging=false);
function move(e){let r=field.getBoundingClientRect();p.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));p.y=Math.max(3,Math.min(97,(e.clientY-r.top)/r.height*100));placePlayer()}
newVineyard();
</script>
</body>
</html>
