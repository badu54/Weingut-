<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Weingut 3D 0.6</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui;color:#f7ead7}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.top{padding:12px 15px;display:flex;justify-content:space-between;background:linear-gradient(#111b,transparent)}.panel{position:absolute;left:12px;right:12px;bottom:12px;max-width:520px;margin:auto;background:#211a14dd;padding:13px;border:1px solid #765b3b;border-radius:17px;pointer-events:auto}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{background:#35291f;color:#f7ead7;border:1px solid #715537;border-radius:10px;padding:10px;font-weight:800}.primary{background:#c89c5b;color:#18130e}.pad{position:absolute;left:15px;bottom:150px;width:90px;height:90px;border-radius:50%;background:#15110dcc;pointer-events:auto}.pad button{position:absolute;width:30px;height:30px;padding:0}.u{left:30px;top:5px}.d{left:30px;bottom:5px}.l{left:5px;top:30px}.r{right:5px;top:30px}.hint{font-size:11px;color:#cdbda7;margin-top:7px}</style></head><body><div id="game"></div><div class="hud"><div class="top"><b>🍇 Weingut</b><span>Jahr 1 · Frühjahr</span></div><div class="panel"><div id="status"><b>Dieter's Weinberg</b><br>Fahre mit dem alten Schlepper durch die Rebreihen.</div><div class="buttons"><button class="primary" onclick="tractorMode()">🚜 Schlepper</button><button onclick="walkMode()">🧍 Aussteigen</button><button onclick="work()">✂️ Arbeit</button><button onclick="story()">📖 Walter</button></div><div class="hint">iPad: Pfeile zum Fahren. Auf der 3D-Fläche wischen = Lenken/Kamera.</div></div><div class="pad"><button class="u">▲</button><button class="d">▼</button><button class="l">◀</button><button class="r">▶</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const S=new THREE.Scene();S.background=new THREE.Color(0x9bb5c0);S.fog=new THREE.Fog(0x9bb5c0,60,190);
const C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);C.position.set(8,7,13);
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.querySelector("#game").appendChild(R.domElement);
S.add(new THREE.HemisphereLight(0xffead0,0x405237,2));let sun=new THREE.DirectionalLight(0xffdfad,2.2);sun.position.set(-30,50,20);sun.castShadow=true;S.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x718653}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
function box(w,h,d,c,x,y,z,parent=S){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.9}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function vine(x,z){box(.12,1.5,.12,0x503b25,x,.75,z);for(let i=0;i<3;i++){let g=new THREE.Mesh(new THREE.SphereGeometry(.22,7,5),new THREE.MeshStandardMaterial({color:0x315b31}));g.scale.set(1.5,.5,1);g.position.set(x+(i-1)*.25,1.2,z+(i%2-.5)*.3);S.add(g)}if(Math.random()<.7)box(.12,.12,.12,0x63376b,x,1,z)}
for(let x=-35;x<=35;x+=5)for(let z=-60;z<=60;z+=3)vine(x,z);
box(16,5,11,0x76543d,-57,2.5,-39);box(18,1.1,13,0x3e2b23,-57,5.55,-39);
const T=new THREE.Group();T.position.set(0,.45,22);S.add(T);box(2.2,.9,3.3,0x58493c,0,.75,0,T);box(1.9,.55,1.4,0x76553d,0,1.2,-1,T);for(let x of[-1,1])for(let z of[-1.05,1.05]){let w=new THREE.Mesh(new THREE.CylinderGeometry(z<0?.55:.43,z<0?.55:.43,.42,14),new THREE.MeshStandardMaterial({color:0x29231e}));w.rotation.z=Math.PI/2;w.position.set(x*1.05,.48,z);w.castShadow=true;T.add(w)}box(1.7,.2,1.4,0x4a3a2d,0,1.9,.3,T);box(2.8,.22,1.2,0x664b35,0,.55,-2.05,T);box(3,.25,.12,0x35271d,0,.78,-2.62,T);
let keys={},mode="tractor";addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
function set(t){document.querySelector("#status").innerHTML=t}
window.tractorMode=()=>{mode="tractor";set("<b>🚜 Schlepper</b><br>Der alte Schlepper läuft noch. Die rostige Frontplattform ist bereit für Kisten und Werkzeug.")};
window.walkMode=()=>{mode="walk";set("<b>🧍 Zu Fuß</b><br>Du kannst den Weinberg erkunden. Als Nächstes bauen wir echte Arbeitsplätze an den Rebstöcken.")};
window.work=()=>{mode="walk";set("<b>✂️ Arbeitsprobe</b><br>Geh zu einer Rebreihe. In der nächsten Version wird dort ein echter Rebschnitt mit einzelnen Rebstöcken möglich.")};
window.story=()=>set("<b>📖 Walter:</b><br>„Dieter ist mit diesem Schlepper durch jeden Winkel gefahren. Rost hatte er damals schon.“");
function touch(cls,k){let b=document.querySelector(cls);b.onpointerdown=()=>keys[k]=1;b.onpointerup=()=>keys[k]=0;b.onpointercancel=()=>keys[k]=0}touch(".u","w");touch(".d","s");touch(".l","a");touch(".r","d");
function drive(){if(mode!="tractor")return;let f=(keys.w?1:0)-(keys.s?1:0),st=(keys.a?1:0)-(keys.d?1:0);T.rotation.y+=st*.035*f;let v=new THREE.Vector3(0,0,-f*.11).applyQuaternion(T.quaternion);T.position.add(v);T.position.x=Math.max(-48,Math.min(48,T.position.x));T.position.z=Math.max(-72,Math.min(60,T.position.z))}
function loop(){requestAnimationFrame(loop);drive();let off=new THREE.Vector3(7,6,11).applyQuaternion(T.quaternion);C.position.lerp(T.position.clone().add(off),.08);C.lookAt(T.position.x,T.position.y+1,T.position.z);R.render(S,C)}loop();addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})
</script></body></html>
