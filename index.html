<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

window.addEventListener('error',e=>{
 const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#300;color:#fff;padding:24px;font:16px system-ui;white-space:pre-wrap';
 d.textContent='3D-Ladefehler\\n'+(e.message||'Unbekannter Fehler')+'\\n\\nBitte Screenshot schicken.';
 document.body.appendChild(d);
});
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc8df);
scene.fog=new THREE.Fog(0x9fc8df,90,260);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x58764b,1.8));
const sun=new THREE.DirectionalLight(0xffefc5,2.3);sun.position.set(-70,100,50);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function mesh(g,m,p=[0,0,0]){let o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function box(p,s,c){return mesh(new THREE.BoxGeometry(...s),mat(c),p)}
function cyl(p,r,h,c){return mesh(new THREE.CylinderGeometry(r,r,h,12),mat(c),p)}

box([0,-.04,0],[360,.08,360],0x78955c);
function lane(z){box([0,.015,z],[82,.03,2.25],0x9b7950)}
for(let r=-6;r<=6;r++)lane(r*3.5);

function vine(x,z,mark=false){
 let g=new THREE.Group();g.position.set(x,0,z);
 let post=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,1.6,8),mat(0x654d38));post.position.y=.8;g.add(post);
 for(let i=-1;i<=1;i++){let l=new THREE.Mesh(new THREE.SphereGeometry(.23,8,6),mat(0x3e7438));l.scale.set(1.8,.45,.7);l.position.set(i*.34,1,0);g.add(l)}
 if(mark){let tor=new THREE.Mesh(new THREE.TorusGeometry(.62,.07,10,32),new THREE.MeshBasicMaterial({color:0xffd21c}));tor.rotation.x=Math.PI/2;tor.position.y=.045;g.add(tor);let flag=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,8),new THREE.MeshBasicMaterial({color:0xffd21c}));flag.position.set(0,2.25,0);g.add(flag);let dot=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),new THREE.MeshBasicMaterial({color:0xff5b20}));dot.position.set(0,2.7,0);g.add(dot);g.userData.work=true}
 scene.add(g);return g;
}
const workVines=[];
for(let i=0;i<12;i++){const x=-38+i*6.9; const z=(i%2===0)?-3.5:0; workVines.push(vine(x,z,true));}
for(let z=-17.5;z<=17.5;z+=3.5)for(let x=-36;x<=36;x+=3.5)if(!(z===-3.5&&x>=-30&&x<=18))vine(x,z,false);

// winery compound: cellar, yard, vineyard connected by broad paths
box([-28,3,-17],[18,6,10],0x997452);box([-28,6.3,-17],[18,.7,10],0x554037);
box([-28,2.4,-22.1],[5,4.8,.3],0x342b26);
box([-28,.12,-11],[12,.2,10],0x78684f);
box([-14,.13,-12],[10,.25,7],0x9b8b68); // yard
box([0,.12,-13],[9,.2,6],0x8d8062); // path
box([8,.12,-3],[5,.2,28],0x9a8a68); // main path
box([8,.12,13],[18,.2,4],0x9a8a68); // vineyard connection

// vineyard boundary removed: player can cross anywhere in play area

// distant hills + village
for(let i=0;i<12;i++){let h=mesh(new THREE.SphereGeometry(20+Math.random()*10,18,10),mat(0x607b55),[-150+i*28,4,-100-Math.random()*40]);h.scale.y=.35}
for(let i=0;i<7;i++)box([72+Math.random()*25,2,-52+Math.random()*18],[5,4,5],0xb68d69);
box([82,5,-53],[6,10,6],0xd2c4a7);box([82,11,-53],[1.2,6,1.2],0x817466);
let roof=mesh(new THREE.ConeGeometry(4.3,3.3,4),mat(0x514b43),[82,11.8,-53]);roof.rotation.y=Math.PI/4;

// Betretbare Innenräume: Weingut + Keller
box([-28,.12,-17],[17,.25,9],0x6f5b48); // floor
box([-28,5.5,-21.2],[17,6,.35],0x4d392e);
box([-36.3,3,-17],[.35,6,9],0x73553d);
box([-19.7,3,-17],[.35,6,9],0x73553d);
// Rückwand mit breiter Türöffnung
box([-28,3,-12.7],[17,6,.35],0x73553d);
box([-35,3,-21.5],[.35,6,1.8],0x73553d);
box([-21,3,-21.5],[.35,6,1.8],0x73553d);
box([-28,5.6,-21.5],[14,1,.35],0x73553d);
box([-28,0.18,-27],[14,.3,9],0x5a493b); // cellar floor
box([-35,2.8,-27],[.35,5.6,9],0x49372d);
box([-21,2.8,-27],[.35,5.6,9],0x49372d);
box([-28,5.6,-27],[14,.5,9],0x3e3028);
box([-35,2.8,-31.3],[28,.35,.35],0x49372d);
box([-21,2.8,-31.3],[28,.35,.35],0x49372d);

// cellar barrels
for(let i=-2;i<=2;i++){cyl([-28+i*2.3,.8,-29.5],.75,1.5,0x6d4b2f);}
// winery equipment: old press, tanks, bottling bench, sales pallet
box([-24,.8,-17],[2.2,1.6,1.4],0x6a4a2e);
cyl([-24,1.7,-17],.65,1.2,0x8c6a3f).rotation.x=Math.PI/2;
box([-31,.9,-16],[1.4,1.8,1.4],0x777a69);
box([-34,.5,-14],[2.5,.9,1.4],0x9a8360);
box([-28,.5,-12.2],[2.8,.7,1.1],0x5c4430);

// tractor
const tractor=new THREE.Group();tractor.position.set(6,.15,8);
function tb(p,s,c){let o=new THREE.Mesh(new THREE.BoxGeometry(...s),mat(c));o.position.set(...p);o.castShadow=o.receiveShadow=true;tractor.add(o)}
tb([0,.8,0],[2.7,1.1,3.3],0x5a4f3c);tb([0,1.48,-.35],[1.7,1,1.8],0x403a31);tb([0,.38,-2],[2.9,.25,1],0x66513d);
for(const x of [-1.35,1.35])for(const z of [-1.15,1.15]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.56,.56,.36,16),mat(0x171717));w.rotation.z=Math.PI/2;w.position.set(x,.55,z);w.castShadow=true;tractor.add(w)}
scene.add(tractor);

// player
const player=new THREE.Group();player.position.set(3,.05,4);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.72,6,10),mat(0x31485a));body.position.y=.65;body.castShadow=true;player.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),mat(0xd3a47d));head.position.y=1.25;head.castShadow=true;player.add(head);scene.add(player);

box([3,.06,7],[4,.12,1.2],0x6d5940);

// zones: not walls, just labels/locations
const signs=[];
function sign(text,x,z){
 let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='rgba(25,20,15,.8)';ctx.fillRect(4,4,504,120);ctx.fillStyle='white';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,80);
 let tex=new THREE.CanvasTexture(c);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(5,1.25,1);sp.position.set(x,3,z);scene.add(sp);signs.push(sp)
}
sign('WEINGUT / KELLER',-28,-9);sign('WEINBERG',8,17);

// sound system – bewusst ohne externe Audiodateien, damit es auch auf iPad/GitHub Pages läuft
let audioCtx=null, master=null, engineGain=null, engineOsc=null, engineNoise=null, ambientTimer=null, stepTimer=0;
function initAudio(){
 if(audioCtx){audioCtx.resume();return true}
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain(); master.gain.value=.28; master.connect(audioCtx.destination);
  const ambient=audioCtx.createGain(); ambient.gain.value=.045; ambient.connect(master);
  const osc=audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=170; osc.connect(ambient); osc.start();
  ambientTimer=setInterval(()=>{ if(!audioCtx||audioCtx.state!=='running')return; chirp(900+Math.random()*500,.035,.018); },6500+Math.random()*4500);
  document.getElementById('sound').textContent='🔊 Ton an';
  return true;
 }catch(e){document.getElementById('sound').textContent='🔇 Ton nicht verfügbar';return false}
}
function chirp(freq,dur,vol){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.25,audioCtx.currentTime+dur);g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+.006);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+dur+.02)}
function noiseBurst(dur,vol,filterFreq=1200){if(!audioCtx)return;const n=audioCtx.createBufferSource(),buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);n.buffer=buf;const f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();f.type='lowpass';f.frequency.value=filterFreq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);n.connect(f);f.connect(g);g.connect(master);n.start();n.stop(audioCtx.currentTime+dur+.02)}
function workSound(){if(!initAudio())return;noiseBurst(.12,.12,2200);setTimeout(()=>chirp(1300,.08,.06),55)}
function stepSound(){if(!audioCtx||audioCtx.state!=='running')return;noiseBurst(.055,.035,700);chirp(120,.06,.018)}
function startEngine(){if(!initAudio()||engineOsc)return;engineGain=audioCtx.createGain();engineGain.gain.value=.0001;engineGain.connect(master);engineOsc=audioCtx.createOscillator();engineOsc.type='sawtooth';engineOsc.frequency.value=48;engineOsc.connect(engineGain);engineOsc.start();const n=audioCtx.createBufferSource();const b=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;n.loop=true;const nf=audioCtx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=900;engineNoise=n;engineNoise.connect(nf);const ng=audioCtx.createGain();ng.gain.value=.055;nf.connect(ng);ng.connect(master);n.start()}
function stopEngine(){if(!audioCtx)return;if(engineGain)engineGain.gain.setTargetAtTime(.0001,audioCtx.currentTime,.05);if(engineOsc){engineOsc.stop(audioCtx.currentTime+.18);engineOsc=null}if(engineNoise){engineNoise.stop(audioCtx.currentTime+.18);engineNoise=null}}
function updateEngine(speed){if(!audioCtx||!engineOsc||!engineGain)return;const rpm=48+Math.abs(speed)*9;engineOsc.frequency.setTargetAtTime(rpm,audioCtx.currentTime,.04);engineGain.gain.setTargetAtTime(.035+Math.abs(speed)*.012,audioCtx.currentTime,.05)}

// state
let driving=false,money=1000,cared=0,nearVine=null,nearTractor=false;
let harvestLiters=0,wineLiters=0,bottles=0,wineCrates=0;
let carried=null, harvestDone=false, pressed=false, bottledDone=false, soldDone=false;
const vineyardInfo={size:0.72,soil:'Kalkmergel · gute Drainage',sun:87,water:71,frost:28,pests:19,health:82,yieldBase:1900};
const equipment={press:true,tanks:2,bottling:true,oldPressCondition:61};
function isVineyard(){return player.position.z>-8 && player.position.x<43}
function isWinery(){return player.position.x>-37&&player.position.x<-19&&player.position.z>-23&&player.position.z<-10}
function isCellar(){return player.position.x>-36&&player.position.x<-20&&player.position.z<-23}
function setInfo(){
 const p=document.getElementById('infoPanel');
 p.innerHTML=`<b>🌱 Weinberg · 0,72 ha</b><br>${vineyardInfo.soil}<br>
 ☀️ Sonne ${vineyardInfo.sun}%<div class="bar"><i style="width:${vineyardInfo.sun}%"></i></div>
 💧 Wasser ${vineyardInfo.water}%<div class="bar"><i style="width:${vineyardInfo.water}%"></i></div>
 ❄️ Frostrisiko ${vineyardInfo.frost}%<div class="bar"><i style="width:${vineyardInfo.frost}%"></i></div>
 🐛 Schädlingsdruck ${vineyardInfo.pests}%<div class="bar"><i style="width:${vineyardInfo.pests}%"></i></div>
 ❤️ Rebenzustand ${vineyardInfo.health}%<div class="bar"><i style="width:${vineyardInfo.health}%"></i></div>
 <b>Ertragspotenzial:</b> ca. ${vineyardInfo.yieldBase} L Trauben vor Verlusten`;
}
function toggleInfo(){
 initAudio(); const p=document.getElementById('infoPanel');
 if(p.style.display==='block'){p.style.display='none';return}
 setInfo();p.style.display='block';msg('📋 Weinberg-Daten geöffnet');
}
function carryObject(type){
 if(carried)return false;
 const g=new THREE.Group();
 const c=type==='basket'?0x9a6b36:0x7d5636;
 const body=new THREE.Mesh(new THREE.BoxGeometry(type==='basket'?0.65:1.0,.42,type==='basket'?.65:.8),mat(c));body.position.y=.35;g.add(body);
 if(type==='basket'){for(let i=-1;i<=1;i+=2){let h=new THREE.Mesh(new THREE.TorusGeometry(.27,.035,8,20,Math.PI),mat(0x4d321d));h.rotation.z=Math.PI/2;h.position.set(i*.25,.55,0);g.add(h)}}
 else {for(let i=-.34;i<=.34;i+=.68){let b=new THREE.Mesh(new THREE.BoxGeometry(.07,.55,.9),mat(0x4b321f));b.position.set(i,.58,0);g.add(b)}}
 g.position.set(player.position.x,0.05,player.position.z+1.0);scene.add(g);carried={type,mesh:g};msg(type==='basket'?'🧺 Korb aufgenommen – zum Traktor/Weingut tragen.':'📦 Weinkiste aufgenommen – zum Verkauf tragen.');chirp(type==='basket'?420:260,.08,.045);return true;
}
function dropCarried(where){
 if(!carried)return;
 scene.remove(carried.mesh);
 const t=carried.type;
 carried=null;
 if(where==='tractor'){harvestLiters+=350;msg('🧺 Korb in den Erntebereich geladen.');}
 else if(where==='press'){harvestLiters+=350;msg('🧺 Trauben zur Kelter gebracht.');}
 else if(where==='sale'){money+=wineCrates*140;msg('💶 Wein verkauft! +'+(wineCrates*140)+' €');wineCrates=0;soldDone=true;}
 noiseBurst(.1,.07,650);
}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')vehicleAction();if(e.key.toLowerCase()==='f')workAction()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function distance(a,b){return Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)}
function msg(t){let h=document.getElementById('hint');h.textContent=t;h.style.display='block';clearTimeout(h.tm);h.tm=setTimeout(()=>h.style.display='none',1800)}
let lastZone='';
function msgOnce(t){if(lastZone!==t){lastZone=t;msg(t)}}
function legacyVehicleAction(){
 if(!driving && distance(player,tractor)<3 && carried){dropCarried('tractor');return}
 if(!driving && distance(player,tractor)<3){initAudio();driving=true;player.visible=false;startEngine();msg('🚜 Eingestiegen – der alte Diesel springt an!');chirp(75,.22,.08)}
 else if(driving){driving=false;player.visible=true;player.position.copy(tractor.position);player.position.x+=2.3;stopEngine();msg('👨‍🌾 Ausgestiegen');noiseBurst(.08,.08,500)}
 else {initAudio();msg('Geh zuerst direkt zum Traktor.')}
}
function legacyWorkAction(){
 initAudio();
 if(driving){msg('Erst aussteigen.');chirp(180,.06,.03);return}
 // carry mode: interact with tractor / receiving area / sales
 if(carried){
   if(carried.type==='basket' && nearTractor){dropCarried('tractor');return}
   if(carried.type==='basket' && isWinery() && distance(player,new THREE.Vector3(-28,0,-18))<7){dropCarried('press');return}
   if(carried.type==='crate' && isWinery() && distance(player,new THREE.Vector3(-28,0,-18))<7){dropCarried('sale');return}
   msg('📦 Bring das Stück zur passenden Station.');return;
 }
 if(isVineyard() && nearVine && !harvestDone && cared<6){
   cared++; vineyardInfo.health=Math.min(100,vineyardInfo.health+2); vineyardInfo.pests=Math.max(0,vineyardInfo.pests-2); money=Math.max(0,money-2);
   nearVine.userData.done=true;nearVine.children.forEach(o=>{if(o.material?.color)o.material.color.set(0x65df70)});
   workSound();msg('✂️ Rebe gepflegt!');
   if(cared===6)msg('🌿 Pflege abgeschlossen – jetzt kann die Ernte vorbereitet werden.');
   return;
 }
 if(isVineyard() && cared>=6 && !harvestDone && nearVine){
   harvestDone=true;
   const quality=Math.max(.55,Math.min(1.08,(vineyardInfo.health*.55+vineyardInfo.sun*.25+vineyardInfo.water*.20)/100));
   harvestLiters=Math.round(vineyardInfo.yieldBase*quality);
   carryObject('basket');msg('🍇 Erste Trauben geerntet: '+harvestLiters+' L Potenzial.');return;
 }
 if(isWinery()){
   if(harvestLiters>0 && !pressed){
     pressed=true; wineLiters=Math.round(harvestLiters*.75); harvestLiters=0; equipment.oldPressCondition=Math.max(0,equipment.oldPressCondition-4);
     msg('⚙️ Kelter läuft: 75% Ausbeute → '+wineLiters+' L Wein.');noiseBurst(.3,.09,900);return;
   }
   if(pressed && !bottledDone){
     bottles=Math.floor(wineLiters/.75); wineLiters=0;bottledDone=true;wineCrates=Math.floor(bottles/12);

   }

 }
 if(isCellar() && bottledDone && wineCrates>0){carryObject('crate');return}

 else {chirp(220,.07,.025);msg('Geh zur gelb markierten Rebe.')}
}

// real physical inventory
let baskets=[], harvestCrates=[], selectedTool='none', processedLiters=0, tankLiters=0, day=18, weather='☀️ Klar', sleepOpen=false;
const MAX_CARRY_KG=24;
function carriedWeight(){
 if(!carried)return 0;
 return carried.type==='basket'?(carried.liters||0)*.18+2:(carried.type==='crate'?8:0);
}
function updateWeight(){const w=carriedWeight();weightUI.style.display=carried?'block':'none';weightUI.textContent=carried?'⚖️ Tragegewicht '+w.toFixed(1)+' / '+MAX_CARRY_KG+' kg':'';}
function makeBasket(liters,x,z){
 const g=new THREE.Group();g.position.set(x,.08,z);
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,.42,12),mat(0x8b5a2b));body.position.y=.35;g.add(body);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.37,.045,8,20),mat(0x4c301c));ring.rotation.x=Math.PI/2;ring.position.y=.58;g.add(ring);
 g.userData={kind:'basket',liters,full:liters>0};g.traverse(o=>{o.castShadow=o.receiveShadow=true});scene.add(g);baskets.push(g);return g;
}
function makeCrate(liters=0,x=6,z=11){
 const g=new THREE.Group();g.position.set(x,.85,z);
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,.7,1.05),mat(0x7b4f2d));g.add(body);
 for(const xx of [-.5,.5]){const b=new THREE.Mesh(new THREE.BoxGeometry(.08,.85,1.08),mat(0x4b321f));b.position.x=xx;g.add(b)}
 g.userData={kind:'crate',liters};g.traverse(o=>{o.castShadow=o.receiveShadow=true});scene.add(g);harvestCrates.push(g);return g;
}
function nearestBasket(){let best=null,bd=2.0;for(const b of baskets){if(!b.parent)continue;const d=distance(player,b);if(d<bd){bd=d;best=b}}return best}
function nearestCrate(){let best=null,bd=2.4;for(const c of harvestCrates){const d=distance(player,c);if(d<bd){bd=d;best=c}}return best}
function removeObj(arr,o){const i=arr.indexOf(o);if(i>=0)arr.splice(i,1);scene.remove(o)}
function pickBasket(b){if(carried)return false; if(b.userData.liters*.18+2>MAX_CARRY_KG){msg('⚖️ Der Korb ist zu schwer!');return false;} carried={type:'basket',mesh:b,liters:b.userData.liters};removeObj(baskets,b);msg('🧺 Korb aufgenommen · '+carried.liters+' L');chirp(430,.08,.05);updateWeight();return true}
function pickCrate(c){if(carried)return false;if(c.userData.liters<=0){msg('📦 Die Kiste ist leer.');return false} if(8>MAX_CARRY_KG){return false} carried={type:'crate',mesh:c,liters:c.userData.liters};removeObj(harvestCrates,c);msg('📦 Kiste aufgenommen · '+carried.liters+' L');chirp(280,.08,.05);updateWeight();return true}
function placeBasketToTrailer(){
 if(!carried||carried.type!=='basket')return false;
 let crate=harvestCrates.find(c=>c.position.distanceTo(trailer.position)<4 && c.userData.liters<500);
 if(!crate)crate=makeCrate(0,trailer.position.x,trailer.position.z);
 crate.position.copy(trailer.position);crate.position.y=.95;
 const add=Math.min(carried.liters,500-crate.userData.liters);crate.userData.liters+=add;
 if(add<carried.liters){makeBasket(carried.liters-add,player.position.x,player.position.z)}
 scene.remove(carried.mesh);carried=null;updateWeight();noiseBurst(.12,.09,800);msg('🧺 '+add+' L in die Erntekiste geschüttet. Kiste: '+crate.userData.liters+'/500 L');return true;
}
function placeCrateAtPress(){
 if(!carried||carried.type!=='crate')return false;

 harvestLiters=Math.max(0,harvestLiters-L); pressed=true;processedLiters+=L;wineLiters+=Math.round(L*.75);tankLiters+=Math.round(L*.75);
 msg('⚙️ '+L+' L Trauben verarbeitet → '+Math.round(L*.75)+' L Most/Wein.');noiseBurst(.35,.11,950);return true;
}

 vineyardInfo.health=Math.min(100,vineyardInfo.health+1);harvestLiters+=L;workSound();workingAnim=.9;msg('🍇 '+L+' L Trauben geerntet – Korb liegt neben der Rebe.');return true;
}

// override interaction with real 0.8 workflow
function vehicleAction(){
 if(driving){driving=false;player.visible=true;player.position.copy(tractor.position);player.position.x+=2.3;stopEngine();msg('👨‍🌾 Ausgestiegen');return;}
 if(distance(player,tractor)<3){initAudio();driving=true;player.visible=false;startEngine();msg('🚜 Eingestiegen – alter Diesel läuft!');return;}
 msg('Geh zum Traktor.');
}
function workAction(){
 initAudio();
 if(driving){msg('Erst aussteigen.');return}
 if(nearHouse()){openHouse();return}
 if(nearGarage()){openGarage();return}
 const b=nearestBasket(); if(b&&!carried){pickBasket(b);return}
 const c=nearestCrate(); if(c&&!carried){pickCrate(c);return}
 if(carried){
   if(carried.type==='basket' && distance(player,trailer)<5){placeBasketToTrailer();return}
   if(carried.type==='crate' && distance(player,new THREE.Vector3(-24,0,-17))<5){placeCrateAtPress();return}
   msg('🚶 Bring den Gegenstand zur passenden Station.');return
 }
 if(isVineyard()&&nearVine&&!nearVine.userData.done){harvestAtVine(nearVine);return}
 if(isWinery()&&processedLiters>0&&!bottledDone){bottledDone=true;bottles=Math.floor(wineLiters/.75);wineLiters=0;wineCrates=Math.floor(bottles/12);tankLiters=0;msg('🍾 Abgefüllt: '+bottles+' Flaschen · '+wineCrates+' Kisten.');return}
 if(isCellar()&&bottledDone&&wineCrates>0){carryObject('crate');return}
 msg('📍 Geh zu einer markierten Rebe, einem Korb, einer Kiste oder einer Station.');
}

// controls
const stick=document.getElementById('stick'),knob=stick.querySelector('i');let joy={x:0,y:0},joyActive=false;
stick.addEventListener('pointerdown',e=>{joyActive=true;stick.setPointerCapture(e.pointerId);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});
stick.addEventListener('pointerup',joyReset);stick.addEventListener('pointercancel',joyReset);
function joyMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/m;joy.y=dy/m}
function joyReset(){joyActive=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}

function hold(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
hold('steerL','left');hold('steerR','right');hold('throttle','up');hold('reverse','down');

function update(dt){
 animTime+=dt;
 if(driving){
  let steer=(keys.left?-1:0)+(keys.right?1:0);let throttle=(keys.up?1:0)-(keys.down?.65:0);let speed=throttle*6.2;
  tractor.rotation.y += steer*(1.15+Math.abs(speed)*.08)*dt;
  tractor.position.x+=Math.sin(tractor.rotation.y)*speed*dt;tractor.position.z+=Math.cos(tractor.rotation.y)*speed*dt;
  for(const o of tractor.children){if(o.geometry?.type==='CylinderGeometry')o.rotation.x-=speed*dt*2.5}
  syncTrailer();updateEngine(speed);
  if(Math.abs(speed)>1.2&&Math.random()<dt*1.7)noiseBurst(.035,.018,450);
  tractor.position.x=Math.max(-42,Math.min(42,tractor.position.x));tractor.position.z=Math.max(-34,Math.min(34,tractor.position.z));
 } else {
  let x=joyActive?joy.x:((keys.d?1:0)-(keys.a?1:0));let z=joyActive?joy.y:((keys.s?1:0)-(keys.w?1:0));let v=new THREE.Vector3(x,0,z);if(v.length()>1)v.normalize();
  player.position.addScaledVector(v,4.5*dt);
  const moving=v.lengthSq()>.01;
  if(moving){player.rotation.y=Math.atan2(v.x,v.z);stepTimer-=dt;if(stepTimer<=0){stepSound();stepTimer=.42}}else stepTimer=0;
  const walk=Math.sin(animTime*10)*.55;legL.rotation.x=moving?walk:0;legR.rotation.x=moving?-walk:0;armL.rotation.x=moving?-walk*.7:0;armR.rotation.x=moving?walk*.7:0;
  if(carried){armL.rotation.x=-1.1;armR.rotation.x=-1.1;pBody.position.y=.65+Math.sin(animTime*4)*.025}
  if(workingAnim>0){workingAnim-=dt;armL.rotation.x=-1.4;armR.rotation.x=-.7;pBody.rotation.z=Math.sin(animTime*14)*.08}
  player.position.x=Math.max(-42,Math.min(42,player.position.x));player.position.z=Math.max(-34,Math.min(34,player.position.z));
 }
 // wind through vines
 for(const v of workVines){v.rotation.z=Math.sin(animTime*1.2+v.position.x*.08)*.025}
 if(pressed)pressWheel.rotation.z-=dt*1.8;
 if(tankLiters>0)tankFill.scale.y=Math.min(1,tankLiters/1500);
 if(carried&&!driving){carried.mesh.position.set(player.position.x,1.0,player.position.z+.75);carried.mesh.rotation.y=player.rotation.y;updateWeight()}
 nearVine=null;let best=999;if(!driving)for(const v of workVines){if(v.userData.done)continue;let d=distance(player,v);if(d<best){best=d;nearVine=v}}
 nearTractor=!driving&&distance(player,tractor)<3;
 let show=nearTractor||nearVine||nearestBasket()||nearestCrate()||carried||nearHouse()||nearGarage()||isWinery()||isCellar();document.getElementById('interact').style.display=show?'block':'none';
 let label=nearTractor?'🚜 Ein-/Aussteigen':(nearHouse()?'🏡 Haus':(nearGarage()?'🔧 Garage':(carried?'📦 Transportieren':(nearestBasket()?'🧺 Korb aufnehmen':(nearestCrate()?'📦 Kiste aufnehmen':(nearVine?'🍇 Ernten':'E Interagieren'))))));document.getElementById('interact').textContent=label;
 document.getElementById('status').textContent=(driving?'🚜 Traktor · ':'👨‍🌾 Zu Fuß · ')+'Frühling · Tag '+day+' · '+money.toLocaleString('de-DE')+' €';
 document.getElementById('count').textContent=workVines.filter(v=>v.userData.done).length+' / '+workVines.length;
 document.getElementById('stock').textContent='Trauben '+harvestLiters+' L · Tank '+tankLiters+' L · Flaschen '+bottles+' · Kisten '+wineCrates;
 document.getElementById('flow').textContent='🍇 Rebe → 🧺 Körbe → 📦 Erntekisten → 🚜 Transport → ⚙️ Presse → 🛢️ Tank → 🍾 Flaschen';
}
function cameraUpdate(){
 let target=driving?tractor:player;let behind=driving?8:6.5;
 let pos=new THREE.Vector3(target.position.x-Math.sin(target.rotation.y)*behind,driving?5.6:4.9,target.position.z-Math.cos(target.rotation.y)*behind);
 camera.position.lerp(pos,.11);camera.lookAt(target.position.x,1.05,target.position.z);
}
function ui(){stick.style.display=driving?'none':'block';document.getElementById('drive').style.display=driving?'block':'none';}
let last=performance.now();
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);cameraUpdate();ui();renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
